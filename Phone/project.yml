# The iPhone and iPad app as an Xcode project, generated by xcodegen (brew install xcodegen). PhoneCore and PhoneUI stay
# Swift packages (Package.swift), so `scripts/test.sh` still runs the tests on the Mac.
name: NightwatchPhone
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NightwatchPhone:
    path: .
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B44CZ9923
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NightwatchPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Nightwatch.icon, Nightwatch.entitlements, Resources]
      - path: App/Nightwatch.icon   # the Mac app's icon, shared with iOS
        buildPhase: resources
      - path: App/Resources/Constellations   # the owner's artwork, copied from the Mac app
        type: folder
        buildPhase: resources
      - path: App/Resources/Events           # Milky Way and no-events art, likewise
        type: folder
        buildPhase: resources
      - path: App/Resources/LightPollution   # the Mac app's world light-pollution grid (VIIRS data, credited in the README); SkyCore carries only Britain's
        type: folder
        buildPhase: resources
      - path: App/Resources/Backdrop         # the Milky Way photograph behind Tonight (Unsplash License; credited in the README)
        type: folder
        buildPhase: resources
    dependencies:
      - package: NightwatchPhone
        product: PhoneCore
      - package: NightwatchPhone
        product: PhoneUI
      - package: NightwatchPhone
        product: PhoneWidgetUI
      - target: NightwatchWidget
    info:
      path: build/NightwatchPhone-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.rsutcliffe.nightwatch.phone.refresh]
        NSLocationWhenInUseUsageDescription: Nightwatch uses your location once, when you ask, to read the forecast for where you are observing from.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.phone
        PRODUCT_NAME: Nightwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: Nightwatch
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Nightwatch.entitlements
  NightwatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [NightwatchWidget.entitlements]
    dependencies:
      - package: NightwatchPhone
        product: PhoneWidgetUI
    info:
      path: build/NightwatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.phone.widget
        PRODUCT_NAME: NightwatchWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/NightwatchWidget.entitlements
        SKIP_INSTALL: "YES"
