# The iPhone and iPad app as an Xcode project, generated by xcodegen (brew install xcodegen). PhoneCore and PhoneUI stay
# Swift packages (Package.swift), so `scripts/test.sh` still runs the tests on the Mac.
name: NightwatchPhone
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NightwatchPhone:
    path: .
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B44CZ9923
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NightwatchPhone:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NightwatchPhone
        product: PhoneCore
      - package: NightwatchPhone
        product: PhoneUI
    info:
      path: build/NightwatchPhone-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Nightwatch uses your location once, when you ask, to read the forecast for where you are observing from.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.phone
        PRODUCT_NAME: Nightwatch
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Nightwatch.entitlements
