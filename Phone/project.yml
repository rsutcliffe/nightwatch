# The iPhone and iPad app as an Xcode project, generated by xcodegen (brew install xcodegen): `xcodegen generate --spec Phone/project.yml`.
# Its libraries (PhoneCore, PhoneUI, PhoneWidgetUI) and SkyCore are targets of the one Swift package at the repository root, so
# the Mac's `scripts/test.sh` runs their tests too and the two apps always build against the same SkyCore. The bundle IDs here are
# still the phone's own: they change to the Mac's only at the step in docs/plans/2026-10-24-universal-app.md.
name: NightwatchPhone
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Nightwatch:
    path: ..
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B44CZ9923
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  NightwatchPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Nightwatch.icon, Nightwatch.entitlements, Resources]
      - path: App/Nightwatch.icon   # the Mac's icon artwork; the Mac's own icon.json says macOS only, so this one stays separate
        buildPhase: resources
      - path: ../Resources/Constellations    # the owner's artwork, shared with the Mac app
        type: folder
        buildPhase: resources
      - path: App/Resources/Events           # Milky Way and no-events art, likewise
        type: folder
        buildPhase: resources
      - path: ../Resources/LightPollution    # the Mac app's world light-pollution grid (VIIRS data, credited in the README); SkyCore carries only Britain's
        type: folder
        buildPhase: resources
      - path: App/Resources/Backdrop         # the Milky Way photograph behind Tonight (Unsplash License; credited in the README)
        type: folder
        buildPhase: resources
    dependencies:
      - package: Nightwatch
        product: PhoneCore
      - package: Nightwatch
        product: PhoneUI
      - package: Nightwatch
        product: PhoneWidgetUI
      - target: NightwatchWidget
    info:
      path: build/NightwatchPhone-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.rsutcliffe.nightwatch.phone
            CFBundleURLSchemes: [nightwatch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.rsutcliffe.nightwatch.phone.refresh]
        NSLocationWhenInUseUsageDescription: Nightwatch uses your location once, when you ask, to read the forecast for where you are observing from.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.phone
        PRODUCT_NAME: Nightwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: Nightwatch
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Nightwatch.entitlements
  NightwatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [NightwatchWidget.entitlements]
    dependencies:
      - package: Nightwatch
        product: PhoneWidgetUI
    info:
      path: build/NightwatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.phone.widget
        PRODUCT_NAME: NightwatchWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/NightwatchWidget.entitlements
        SKIP_INSTALL: "YES"
